name: agriconnect
description: "AgriConnect - AI-Powered Agricultural Coordination Platform for SIH 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0
  socket_io_client: ^3.1.6
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  razorpay_flutter: ^1.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
